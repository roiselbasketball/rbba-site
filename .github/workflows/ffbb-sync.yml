name: Données FFBB

# Lancé toutes les 5 minutes ; le script décide lui-même s'il récupère
# (5 min pendant un match, 15 min le jour de match, 1 h sinon).
on:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Forcer la récupération maintenant"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: ffbb-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r scripts/requirements.txt

      - name: Récupérer les données
        id: sync
        env:
          RBBA_SITE_URL: ${{ vars.RBBA_SITE_URL || 'https://roiselbasketball.github.io/rbba-site' }}
          RBBA_ORGANISME_ID: ${{ vars.RBBA_ORGANISME_ID }}
        run: |
          set +e
          python scripts/ffbb_sync.py ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force)) && '--force' || '' }}
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = "1" ] && exit 1 || exit 0

      - name: Enregistrer les données si elles ont changé
        id: commit
        run: |
          git config user.name "rbba-bot"
          git config user.email "rbba-bot@users.noreply.github.com"
          git add data/ matchs/ sitemap.xml
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"
          else git commit -m "Données FFBB $(date -u +%FT%TZ)" && git push && echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # Mise en ligne du site (GitHub Pages) quand les données ont changé
      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: .
      - uses: actions/deploy-pages@v4
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'

      # Plus de 24 h sans données : alerte au référent (ticket = e-mail automatique de GitHub)
      - name: Alerte
        if: steps.sync.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh issue list --label alerte-ffbb --state open | grep -q .; then
            gh label create alerte-ffbb --color D9A632 --force
            gh issue create --label alerte-ffbb \
              --title "Les données FFBB ne remontent plus depuis 24 h" \
              --body "Le site affiche les dernières données connues. Vérifier data/status.json. En attendant, un score peut être saisi dans data/manual.json."
          fi
